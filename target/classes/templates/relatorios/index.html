<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" th:href="@{/css/fallback.css}" />
</head>
<body class="bg-base-100 min-h-screen">
<div th:replace="~{fragments/navbar :: menu}"></div>
<main class="max-w-5xl mx-auto p-6 space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-3xl font-bold">Relatório de empréstimos</h1>
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    <div class="card bg-base-200 shadow">
      <div class="card-body">
        <h2 class="card-title">Resumo geral</h2>
        <div class="space-y-4">
          <div class="flex justify-between">
            <span>Total de empréstimos</span>
            <strong th:text="${emprestimosTotal}"></strong>
          </div>
          <div class="flex justify-between">
            <span>Em aberto</span>
            <strong th:text="${emprestimosAbertos}"></strong>
          </div>
          <div class="flex justify-between">
            <span>Devolvidos</span>
            <strong th:text="${emprestimosDevolvidos}"></strong>
          </div>
        </div>
      </div>
    </div>

    <div class="card bg-base-200 shadow md:col-span-2">
      <div class="card-body">
        <h2 class="card-title">Empréstimos por status</h2>
        <div class="bg-base-100 rounded-box p-6">
          <canvas id="emprestimosChart" height="160"></canvas>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
  const emprestimosAbertos = /*[[${emprestimosAbertos}]]*/ 0;
  const emprestimosDevolvidos = /*[[${emprestimosDevolvidos}]]*/ 0;

  const ctx = document.getElementById('emprestimosChart');
  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ['Em aberto', 'Devolvidos'],
      datasets: [{
        data: [emprestimosAbertos, emprestimosDevolvidos],
        backgroundColor: ['#f59e0b', '#16a34a']
      }]
    },
    options: {
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });
</script>
</body>
</html>
