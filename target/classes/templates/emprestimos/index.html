<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empréstimos</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" th:href="@{/css/fallback.css}" />
</head>
<body class="bg-base-100 min-h-screen">
<div th:replace="~{fragments/navbar :: menu}"></div>
<main class="max-w-6xl mx-auto p-6 space-y-6">
  <h1 class="text-3xl font-bold">Empréstimos</h1>

  <div class="card bg-base-200 shadow">
    <div class="card-body">
      <h2 class="card-title">Novo empréstimo</h2>
      <form th:action="@{/emprestimos/salvar}" th:object="${objeto}" method="post" class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="label">Usuário</label>
          <select th:field="*{usuarioId}" class="select select-bordered w-full">
            <option value="">Selecione</option>
            <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.nome}"></option>
          </select>
        </div>
        <div>
          <label class="label">Livro</label>
          <select th:field="*{livroId}" class="select select-bordered w-full">
            <option value="">Selecione</option>
            <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}"></option>
          </select>
        </div>
        <div class="md:col-span-2">
          <button class="btn btn-primary">Emprestar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="overflow-x-auto bg-base-200 rounded-box p-2">
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Usuário</th>
        <th>Livro</th>
        <th>Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${lista}" class="hover:bg-base-300">
        <td th:text="${item.id}"></td>
        <td th:text="${item.usuario.nome}"></td>
        <td th:text="${item.livro.titulo}"></td>
        <td class="flex gap-2">
          <a th:href="@{/emprestimos/devolver/{id}(id=${item.id})}" class="btn btn-outline btn-sm" th:if="${item.dataDevolucao == null}">Devolver</a>
          <span class="badge badge-success" th:if="${item.dataDevolucao != null}">Devolvido</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
