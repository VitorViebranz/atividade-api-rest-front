<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" th:href="@{/css/fallback.css}" />
</head>
<body class="bg-base-100 min-h-screen">
<div th:replace="~{fragments/navbar :: menu}"></div>
<main class="max-w-5xl mx-auto p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-3xl font-bold">Usuários</h1>
    <a th:href="@{/novo}" class="btn btn-primary">Novo usuário</a>
  </div>

  <div class="overflow-x-auto bg-base-200 rounded-box p-2">
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${lista}" class="hover:bg-base-300">
        <td th:text="${item.id}"></td>
        <td th:text="${item.nome}"></td>
        <td class="flex gap-2">
          <a th:href="@{/editar/{id}(id=${item.id})}" class="btn btn-outline btn-sm">Editar</a>
          <a th:href="@{/excluir/{id}(id=${item.id})}" class="btn btn-error btn-sm">Excluir</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
